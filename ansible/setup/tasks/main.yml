##################################################
## apt update / upgrade
##################################################
- name: update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: upgrade all packages
  apt:
    upgrade: dist
  register: pkgupgrade

- name: reboot if kernel or packages updated
  reboot:
  when: pkgupgrade is changed

##################################################
## disable UFW, swap
##################################################
- name: disable UFW
  ufw:
    state: disabled

- name: disable swap in fstab
  replace:
    path: /etc/fstab
    regexp: '^([^#].*\sswap\s.*)$'
    replace: '#\1'

- name: turn off swap
  command: swapoff -a
  changed_when: false

##################################################
## kernel modules for Kubernetes
##################################################
- name: ensure overlay and br_netfilter modules load on boot
  copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter

- name: load overlay module
  modprobe:
    name: overlay
    state: present

- name: load br_netfilter module
  modprobe:
    name: br_netfilter
    state: present

- name: set sysctl params for Kubernetes
  sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_set: yes
    state: present
    reload: yes
  loop:
    - { name: net.bridge.bridge-nf-call-iptables,  value: '1' }
    - { name: net.bridge.bridge-nf-call-ip6tables, value: '1' }
    - { name: net.ipv4.ip_forward,                 value: '1' }

##################################################
## NTP and locale
##################################################
- name: install chrony
  apt:
    name: chrony
    state: present

- name: configure NTP servers (NICT/mfeed)
  blockinfile:
    path: /etc/chrony/chrony.conf
    block: |
      server ntp.jst.mfeed.ad.jp iburst
      server ntp.nict.jp iburst

- name: restart chrony
  service:
    name: chrony
    state: restarted
    enabled: yes

- name: sync time immediately
  command: chronyc -a makestep
  changed_when: false

- name: set timezone to Asia/Tokyo
  timezone:
    name: Asia/Tokyo

- name: set locale to ja_JP.UTF-8
  shell: localectl set-locale LANG=ja_JP.UTF-8
  changed_when: false

- name: set LANG in .bashrc
  lineinfile:
    path: /home/vagrant/.bashrc
    line: 'export LANG=ja_JP.UTF-8'
    create: yes
