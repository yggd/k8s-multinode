###################################################
## Kubernetes インストール (pkgs.k8s.io apt リポジトリ)
###################################################
- name: install Kubernetes apt prerequisites
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
    state: present

- name: create /etc/apt/keyrings
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: add Kubernetes GPG key
  shell: |
    curl -fsSL https://pkgs.k8s.io/core:/stable:/v{{ k8s_minor_version }}/deb/Release.key \
      | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
  args:
    creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

- name: add Kubernetes apt repository
  apt_repository:
    repo: >-
      deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg]
      https://pkgs.k8s.io/core:/stable:/v{{ k8s_minor_version }}/deb/ /
    state: present
    filename: kubernetes

- name: install kubelet kubeadm kubectl
  apt:
    name:
      - kubelet={{ k8s_version }}
      - kubeadm={{ k8s_version }}
      - kubectl={{ k8s_version }}
    update_cache: yes
    state: present

- name: hold kubelet kubeadm kubectl at current version
  dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - kubelet
    - kubeadm
    - kubectl

- name: enable kubelet
  systemd:
    name: kubelet
    state: started
    enabled: yes

- name: set KUBELET_EXTRA_ARGS (node-ip)
  copy:
    dest: /etc/default/kubelet
    content: |
      KUBELET_EXTRA_ARGS="--node-ip={{ ansible_facts[k8s_node_iface].ipv4.address }}"
    mode: '0644'

- name: daemon-reload and restart kubelet
  systemd:
    name: kubelet
    state: restarted
    daemon_reload: yes
