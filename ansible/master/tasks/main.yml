##################################################
## master ノード初期化
##################################################
- name: kubeadm reset
  command: kubeadm reset -f --cri-socket unix:///var/run/containerd/containerd.sock

- name: kubeadm init
  command: >
    kubeadm init
    --pod-network-cidr={{ pod_network_cidr }}
    --apiserver-advertise-address={{ ansible_facts[k8s_node_iface].ipv4.address }}
    --service-cidr={{ service_cidr }}
    --cri-socket unix:///var/run/containerd/containerd.sock
  register: kubeadm_init

- name: generate kubeadm join command
  command: kubeadm token create --print-join-command
  register: join_command_raw

- name: save join command to file
  copy:
    content: "join_command: {{ join_command_raw.stdout }}"
    dest: /tmp/kubeadm-join.yaml

- name: fetch kubeadm-join.yaml to control node
  fetch:
    src: /tmp/kubeadm-join.yaml
    dest: ./kubeadm-join.yaml
    flat: true

- name: update cluster DNS in kubelet config
  replace:
    dest: /var/lib/kubelet/config.yaml
    regexp: '10.96.0.10'
    replace: "{{ cluster_dns }}"

- name: restart kubelet
  systemd:
    name: kubelet
    state: restarted
    daemon_reload: yes

- name: create .kube directory for vagrant
  file:
    path: /home/vagrant/.kube
    state: directory
    owner: vagrant
    group: vagrant
    mode: '0755'

- name: copy admin.conf to vagrant kubeconfig
  copy:
    src: /etc/kubernetes/admin.conf
    dest: /home/vagrant/.kube/config
    remote_src: yes
    owner: vagrant
    group: vagrant
    mode: '0600'

##################################################
## Flannel CNI
##################################################
- name: deploy Flannel manifest
  template:
    src: kube-flannel.yml
    dest: /home/vagrant/kube-flannel.yml
    owner: vagrant
    group: vagrant
    mode: '0644'

- name: apply Flannel
  become_user: vagrant
  command: kubectl apply -f /home/vagrant/kube-flannel.yml

##################################################
## Metrics Server
##################################################
- name: download Metrics Server manifest
  get_url:
    url: https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
    dest: /home/vagrant/metrics-server-deployment.yaml
    mode: '0644'
  become_user: vagrant

- name: add --kubelet-insecure-tls to Metrics Server
  blockinfile:
    path: /home/vagrant/metrics-server-deployment.yaml
    insertafter: '        - --kubelet-preferred-address-types=InternalIP,ExternalIP,Hostname'
    block: |2
              - --kubelet-insecure-tls
              - --kubelet-preferred-address-types=InternalDNS,InternalIP,ExternalDNS,ExternalIP,Hostname

- name: comment out original address-types line
  replace:
    dest: /home/vagrant/metrics-server-deployment.yaml
    regexp: '^(        - --kubelet-preferred-address-types=InternalIP,ExternalIP,Hostname)$'
    replace: '#\1'

- name: deploy Metrics Server
  become_user: vagrant
  command: kubectl apply -f /home/vagrant/metrics-server-deployment.yaml

##################################################
## Helm インストール
##################################################
- name: fetch Helm install script
  uri:
    url: https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
    return_content: yes
  register: helm_installer

- name: install Helm
  shell: "{{ helm_installer.content }}"
  args:
    executable: /bin/bash
    creates: /usr/local/bin/helm
  environment:
    PATH: /usr/local/bin:{{ ansible_env.PATH }}

# Kubernetes Dashboard はリポジトリ URL が変動しやすいため手動インストールを推奨。
# 最新の手順は https://github.com/kubernetes/dashboard を参照。
# 例:
#   helm repo add kubernetes-dashboard https://kubernetes.github.io/dashboard/
#   helm upgrade --install kubernetes-dashboard kubernetes-dashboard/kubernetes-dashboard \
#     --create-namespace --namespace kubernetes-dashboard
