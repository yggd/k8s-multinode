- name: kubeadm reset
  command: kubeadm reset -f --cri-socket unix:///var/run/containerd/containerd.sock

- name: load kubeadm join variables
  include_vars: ./kubeadm-join.yaml

- name: kubeadm join
  command: "{{ join_command }} --cri-socket unix:///var/run/containerd/containerd.sock"

- name: update cluster DNS in kubelet config
  replace:
    dest: /var/lib/kubelet/config.yaml
    regexp: '10.96.0.10'
    replace: "{{ cluster_dns }}"

- name: restart kubelet
  systemd:
    name: kubelet
    state: restarted
    daemon_reload: yes
